</style></head><body><header><b>BLACKMI CONNECT</b> <small>2.0 / GROUP</small><div><small id="topStatus">未加入房间</small></div></header><nav><table><tr><td><button id="navChat">群聊</button></td><td><button id="navPair">连接</button></td><td><button id="navMembers">成员</button></td><td><button id="navSettings">设置</button></td></tr></table></nav><div id="screen"></div><div id="pages" style="display:none">
<section id="chat"><h2 id="chatTitle">局域网群聊</h2><p class="status" id="chatStatus">请先创建或加入房间</p><div id="chatList"></div><table><tr><td style="width:78%"><textarea id="message" rows="2" maxlength="1000" placeholder="输入消息"></textarea></td><td><button id="send" class="primary" disabled>发送</button></td></tr></table><small>仅本次会话；房主负责群消息转发。请在获准通信的网络使用。</small></section>
<section id="pair"><h2>房间连接</h2><p id="pairStatus" class="status"></p><p class="muted">房主创建房间后，每次邀请一位成员。成员扫邀请，房主再扫该成员应答。其他已加入成员不会断开。</p><table><tr><td><button id="createRoom" class="primary">创建房间</button></td><td><button id="scanOffer" class="primary">加入房间 · 扫码</button></td></tr><tr><td><button id="offer">邀请下一位</button></td><td><button id="scanAnswer">房主扫描应答</button></td></tr><tr><td><button id="showLocal">再次显示二维码</button></td><td><button id="manual">手动配对</button></td></tr><tr><td><button id="cancelInvite">取消当前邀请</button></td><td><button id="disconnect">退出 / 解散房间</button></td></tr></table><p class="muted">初版最多 8 台（含房主）；未验证最大并发。无需额外服务器；房主关闭页面后房间结束。</p></section>
<section id="members"><h2>在线成员</h2><p id="memberCount" class="status"></p><div id="memberList"></div><button id="refreshMembers">刷新名单</button></section>
<section id="display"><h2 id="qrTitle">本机二维码</h2><p id="qrPage" class="status"></p><canvas id="qrCanvas"></canvas><table><tr><td><button id="qrPrev">上一张</button></td><td><button id="qrNext">下一张</button></td></tr><tr><td><button id="backPair">返回连接</button></td><td><button id="displayNext" class="primary">下一步</button></td></tr></table><small>多张时须逐张扫描。当前邀请只供一位成员使用。</small></section>
<section id="scanner"><h2 id="scanTitle">扫描二维码</h2><p id="qrStatus" class="status">等待操作</p><video id="qrVideo" muted autoplay playsinline style="display:none"></video><canvas id="scanCanvas"></canvas><table><tr><td><button id="camStart" class="primary">启动摄像头</button></td><td><button id="camStop">关闭摄像头</button></td></tr></table><label>或导入二维码图片</label><input id="qrImage" type="file" accept="image/*"><table><tr><td><button id="scanBack">返回</button></td><td><button id="scanReset">清除分片</button></td></tr></table></section>
<section id="manualPage"><h2>手动配对</h2><label>本机连接码</label><textarea id="local" rows="3" readonly></textarea><button id="saveCode">导出 TXT</button><label>对方连接码</label><textarea id="remote" rows="3"></textarea><input id="importCode" type="file" accept=".txt,.json,text/plain"><table><tr><td><button id="manualOffer">房主创建邀请</button></td><td><button id="manualAnswer">成员生成应答</button></td><td><button id="manualAccept">房主确认应答</button></td></tr></table><button id="manualBack">返回连接</button></section>
<section id="settings"><h2>个人设置</h2><label>昵称（最多24字）</label><input id="nickname" maxlength="24"><button id="saveName" class="primary">保存昵称</button><table><tr><td><button id="clearChat">清空本机聊天</button></td><td><button id="showLog">连接诊断</button></td></tr></table><p class="muted">消息仅内存保存；成员可阅读群内消息，房主可读取转发内容。没有后台连接或自动重连。</p></section><section id="diagnostic"><h2>连接诊断</h2><p id="log"></p><button id="logBack">返回设置</button></section></div><noscript>需要 JavaScript</noscript><script>

var QRMath = require('./QRMath');

function QRPolynomial(num, shift) {
	if (num.length === undefined) {
		throw new Error(num.length + "/" + shift);
	}

	var offset = 0;

	while (offset < num.length && num[offset] === 0) {
		offset++;
	}

	this.num = new Array(num.length - offset + shift);
	for (var i = 0; i < num.length - offset; i++) {
		this.num[i] = num[i + offset];
	}
}

QRPolynomial.prototype = {

	get : function(index) {
		return this.num[index];
	},
	
	getLength : function() {
		return this.num.length;
	},
	
	multiply : function(e) {
	
		var num = new Array(this.getLength() + e.getLength() - 1);
	
		for (var i = 0; i < this.getLength(); i++) {
			for (var j = 0; j < e.getLength(); j++) {
				num[i + j] ^= QRMath.gexp(QRMath.glog(this.get(i) ) + QRMath.glog(e.get(j) ) );
			}
		}
	
		return new QRPolynomial(num, 0);
	},
	
	mod : function(e) {
	
		if (this.getLength() - e.getLength() < 0) {
			return this;
		}
	
		var ratio = QRMath.glog(this.get(0) ) - QRMath.glog(e.get(0) );
	
		var num = new Array(this.getLength() );
		
		for (var i = 0; i < this.getLength(); i++) {
			num[i] = this.get(i);
		}
		
		for (var x = 0; x < e.getLength(); x++) {
			num[x] ^= QRMath.gexp(QRMath.glog(e.get(x) ) + ratio);
		}
	
		// recursive call
		return new QRPolynomial(num, 0).mod(e);
	}
};

        [6, 24, 50, 76, 102, 128, 154],
        [6, 28, 54, 80, 106, 132, 158],
        [6, 32, 58, 84, 110, 136, 162],
        [6, 26, 54, 82, 110, 138, 166],
        [6, 30, 58, 86, 114, 142, 170]
    ],

    G15 : (1 << 10) | (1 << 8) | (1 << 5) | (1 << 4) | (1 << 2) | (1 << 1) | (1 << 0),
    G18 : (1 << 12) | (1 << 11) | (1 << 10) | (1 << 9) | (1 << 8) | (1 << 5) | (1 << 2) | (1 << 0),
    G15_MASK : (1 << 14) | (1 << 12) | (1 << 10)    | (1 << 4) | (1 << 1),

    getBCHTypeInfo : function(data) {
        var d = data << 10;
        while (QRUtil.getBCHDigit(d) - QRUtil.getBCHDigit(QRUtil.G15) >= 0) {
            d ^= (QRUtil.G15 << (QRUtil.getBCHDigit(d) - QRUtil.getBCHDigit(QRUtil.G15) ) );    
        }
        return ( (data << 10) | d) ^ QRUtil.G15_MASK;
    },

    getBCHTypeNumber : function(data) {
        var d = data << 12;
        while (QRUtil.getBCHDigit(d) - QRUtil.getBCHDigit(QRUtil.G18) >= 0) {
            d ^= (QRUtil.G18 << (QRUtil.getBCHDigit(d) - QRUtil.getBCHDigit(QRUtil.G18) ) );    
        }
        return (data << 12) | d;
    },

    getBCHDigit : function(data) {

        var digit = 0;

        while (data !== 0) {
            digit++;
            data >>>= 1;
        }

        return digit;
    },

    getPatternPosition : function(typeNumber) {
        return QRUtil.PATTERN_POSITION_TABLE[typeNumber - 1];
    },

    getMask : function(maskPattern, i, j) {
        
        switch (maskPattern) {
            
        case QRMaskPattern.PATTERN000 : return (i + j) % 2 === 0;
        case QRMaskPattern.PATTERN001 : return i % 2 === 0;
        case QRMaskPattern.PATTERN010 : return j % 3 === 0;
        case QRMaskPattern.PATTERN011 : return (i + j) % 3 === 0;
        case QRMaskPattern.PATTERN100 : return (Math.floor(i / 2) + Math.floor(j / 3) ) % 2 === 0;
        case QRMaskPattern.PATTERN101 : return (i * j) % 2 + (i * j) % 3 === 0;
        case QRMaskPattern.PATTERN110 : return ( (i * j) % 2 + (i * j) % 3) % 2 === 0;
        case QRMaskPattern.PATTERN111 : return ( (i * j) % 3 + (i + j) % 2) % 2 === 0;

        default :
            throw new Error("bad maskPattern:" + maskPattern);
        }
    },

    getErrorCorrectPolynomial : function(errorCorrectLength) {

        var a = new QRPolynomial([1], 0);

        for (var i = 0; i < errorCorrectLength; i++) {
            a = a.multiply(new QRPolynomial([1, QRMath.gexp(i)], 0) );

        return a;
    },

    getLengthInBits : function(mode, type) {

        if (1 <= type && type < 10) {

            // 1 - 9

            switch(mode) {
            case QRMode.MODE_NUMBER     : return 10;
            case QRMode.MODE_ALPHA_NUM  : return 9;
            case QRMode.MODE_8BIT_BYTE  : return 8;
            case QRMode.MODE_KANJI      : return 8;
            default :
                throw new Error("mode:" + mode);
            }

        } else if (type < 27) {

            // 10 - 26

            switch(mode) {
            case QRMode.MODE_NUMBER     : return 12;
            case QRMode.MODE_ALPHA_NUM  : return 11;
            case QRMode.MODE_8BIT_BYTE  : return 16;
            case QRMode.MODE_KANJI      : return 10;
            default :
                throw new Error("mode:" + mode);
            }

        } else if (type < 41) {

            // 27 - 40

            switch(mode) {
            case QRMode.MODE_NUMBER     : return 14;
            case QRMode.MODE_ALPHA_NUM  : return 13;
            case QRMode.MODE_8BIT_BYTE  : return 16;
            case QRMode.MODE_KANJI      : return 12;
            default :
                throw new Error("mode:" + mode);
            }

        } else {
            throw new Error("type:" + type);
        }
    },

    getLostPoint : function(qrCode) {
        
        var moduleCount = qrCode.getModuleCount();
        var lostPoint = 0;
        var row = 0; 
        var col = 0;

        
        // LEVEL1
        
        for (row = 0; row < moduleCount; row++) {

            for (col = 0; col < moduleCount; col++) {

                var sameCount = 0;
                var dark = qrCode.isDark(row, col);

                for (var r = -1; r <= 1; r++) {

                    if (row + r < 0 || moduleCount <= row + r) {
                        continue;
                    }

                    for (var c = -1; c <= 1; c++) {

                        if (col + c < 0 || moduleCount <= col + c) {
                            continue;
                        }

                        if (r === 0 && c === 0) {
                            continue;
                        }

                        if (dark === qrCode.isDark(row + r, col + c) ) {
                            sameCount++;
                        }
                    }
                }

                if (sameCount > 5) {
                    lostPoint += (3 + sameCount - 5);
                }
            }
        }

        // LEVEL2

        for (row = 0; row < moduleCount - 1; row++) {
            for (col = 0; col < moduleCount - 1; col++) {
                var count = 0;
                if (qrCode.isDark(row,     col    ) ) count++;
                if (qrCode.isDark(row + 1, col    ) ) count++;
                if (qrCode.isDark(row,     col + 1) ) count++;
                if (qrCode.isDark(row + 1, col + 1) ) count++;
                if (count === 0 || count === 4) {
                    lostPoint += 3;
                }
            }
        }

        // LEVEL3

        for (row = 0; row < moduleCount; row++) {
            for (col = 0; col < moduleCount - 6; col++) {
                if (qrCode.isDark(row, col) && 
                        !qrCode.isDark(row, col + 1) && 
                         qrCode.isDark(row, col + 2) && 
                         qrCode.isDark(row, col + 3) && 
                         qrCode.isDark(row, col + 4) && 
                        !qrCode.isDark(row, col + 5) && 
                         qrCode.isDark(row, col + 6) ) {
                    lostPoint += 40;
                }
            }
        }

        for (col = 0; col < moduleCount; col++) {
            for (row = 0; row < moduleCount - 6; row++) {
                if (qrCode.isDark(row, col) &&
                        !qrCode.isDark(row + 1, col) &&
                         qrCode.isDark(row + 2, col) &&
                         qrCode.isDark(row + 3, col) &&
                         qrCode.isDark(row + 4, col) &&
                        !qrCode.isDark(row + 5, col) &&
                         qrCode.isDark(row + 6, col) ) {
                    lostPoint += 40;
                }
            }
        }

        // LEVEL4
        
        var darkCount = 0;

        for (col = 0; col < moduleCount; col++) {
            for (row = 0; row < moduleCount; row++) {
                if (qrCode.isDark(row, col) ) {
                    darkCount++;
                }
            }
        }
        
        var ratio = Math.abs(100 * darkCount / moduleCount / moduleCount - 50) / 5;
        lostPoint += ratio * 10;

        return lostPoint;       
    }

};

module.exports = QRUtil;

		this.setupPositionProbePattern(0, this.moduleCount - 7);

function reset(){++epoch;stopCam();links.concat(up?[up]:[]).forEach(function(l){l.dead=true;clearTimeout(l.timer);try{if(l.c)l.c.close();l.p.close();}catch(e){}});links=[];pending=null;up=null;role='';room='';me='';roster=[];history=[];clearQR();status('未加入房间');}
function createRoom(){if(role)return;try{room=uid();me=uid();role='host';seq=0;history=[];syncRoster();status('房间已创建，请邀请成员');}catch(e){status(msg(e));}}
function fail(e,l){if(l&&!l.dead)drop(l);status('失败：'+msg(e));show('pair');}
function showCode(d,l,manualMode){if(l.dead)return;var code=pack(d),restored=unpack(code);assert(restored.sdp===d.sdp&&restored.type===d.type,'连接码校验失败');localKind=d.type;$('local').value=formatCode(code);displayQR(code,d.type);status(d.type==='offer'?'邀请已生成，等待成员应答':'应答已生成，等待房主扫描');if(!manualMode)show('display');}
function offer(manualMode){var l;try{if(!role)createRoom();assert(role==='host'&&!pending&&links.length<MAX-1,'请先完成或取消当前邀请，且房间不能超过8人');l=newLink();pending=l;links.push(l);setup(l,l.p.createDataChannel('blackmi-group'));status('正在生成邀请…');localDesc(l.p,'offer').then(function(d){showCode(d,l,manualMode);}).catch(function(e){if(!l.dead)fail(e,l);});}catch(e){fail(e,l);}}
function answer(d,manualMode){var l;try{assert(!role,'请先退出当前房间');assert(d&&d.type==='offer','需要房主邀请');l=newLink();role='guest';up=l;history=[];roster=[];l.p.ondatachannel=function(e){if(!l.dead)setup(l,e.channel);};status('正在生成应答…');l.p.setRemoteDescription(d).then(function(){return localDesc(l.p,'answer');}).then(function(a){showCode(a,l,manualMode);}).catch(function(e){if(!l.dead)fail(e,l);});}catch(e){fail(e,l);}}
function accept(d){try{assert(role==='host'&&pending&&pending.p.signalingState==='have-local-offer','请先创建当前成员邀请');assert(d&&d.type==='answer','需要成员应答');var l=pending;status('应答已接收，正在连接…');show('chat');l.p.setRemoteDescription(d).catch(function(e){if(!l.dead)fail(e,l);});}catch(e){fail(e);}}
function waitICE(p){return new Promise(function(resolve,reject){var done=false,tm;function finish(ok){if(done)return;done=true;clearTimeout(tm);p.removeEventListener('icegatheringstatechange',check);if(ok)resolve(p.localDescription);else reject(new Error('ICE 收集超时'));}function check(){if(p.iceGatheringState==='complete')finish(true);}p.addEventListener('icegatheringstatechange',check);tm=setTimeout(function(){finish(false);},15000);check();});}
function localDesc(p,kind){return (kind==='offer'?p.createOffer():p.createAnswer()).then(function(d){return p.setLocalDescription(d);}).then(function(){return waitICE(p);});}
// Lossless SDP codec: dictionary tokens, hex-byte packing, digit packing, Crockford Base32, CRC16.
var alphabet='0123456789ABCDEFGHJKMNPQRSTVWXYZ';
var dict=['v=0\r\n','o=- ',' IN IP4 127.0.0.1\r\n','s=-\r\n','t=0 0\r\n','a=group:BUNDLE ','a=extmap-allow-mixed\r\n','a=msid-semantic: WMS','m=application ',' UDP/DTLS/SCTP webrtc-datachannel\r\n','c=IN IP4 ','a=ice-ufrag:','a=ice-pwd:','a=ice-options:trickle\r\n','a=fingerprint:sha-256 ','a=setup:actpass\r\n','a=setup:active\r\n','a=setup:passive\r\n','a=mid:','a=sctp-port:5000\r\n','a=max-message-size:262144\r\n','a=candidate:',' 1 udp ',' 1 tcp ',' typ host',' generation 0',' network-id ',' network-cost ',' tcptype passive','a=end-of-candidates\r\n','\r\n','0.0.0.0','.local',' DTLS/SCTP 5000\r\n','a=sctpmap:5000 webrtc-datachannel 1024\r\n','a=max-message-size:','a=ice-options:',' typ srflx',' typ relay',' raddr ',' rport ',' 2 ','a=connection:new\r\n'];
function crc(a){var c=65535;for(var i=0;i<a.length;i++){c^=a[i]<<8;for(var j=0;j<8;j++)c=((c<<1)^((c&32768)?4129:0))&65535;}return c;}
function b32(a){var out='',v=0,b=0;for(var i=0;i<a.length;i++){v=(v<<8)|a[i];b+=8;while(b>=5){b-=5;out+=alphabet[(v>>b)&31];}v&=(1<<b)-1;}if(b)out+=alphabet[(v<<(5-b))&31];return out;}
function un32(s){var a=[],v=0,b=0;for(var i=0;i<s.length;i++){var x=alphabet.indexOf(s.charAt(i));assert(x>=0,'存在无效字符');v=(v<<5)|x;b+=5;if(b>=8){b-=8;a.push((v>>b)&255);}v&=(1<<b)-1;}assert(v===0&&b<5,'末尾字符不完整');return a;}
function pack(d){var s=d.sdp,a=[3,d.type==='offer'?1:2],i=0;while(i<s.length){var tail=s.slice(i),m,j,best=-1;
 m=/^([0-9A-F]{2}(?::[0-9A-F]{2}){7,})(?![0-9A-F:])/.exec(tail);if(m){var h=m[1].split(':');if(h.length<=255){a.push(250,h.length);for(j=0;j<h.length;j++)a.push(parseInt(h[j],16));i+=m[1].length;continue;}}
 m=/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/.exec(tail);if(m){var hex=m[0].replace(/-/g,'');a.push(251);for(j=0;j<32;j+=2)a.push(parseInt(hex.slice(j,j+2),16));i+=36;continue;}
 for(j=0;j<dict.length;j++)if(tail.indexOf(dict[j])===0&&(best<0||dict[j].length>dict[best].length))best=j;if(best>=0){a.push(128+best);i+=dict[best].length;continue;}
 m=/^\d{5,254}/.exec(tail);if(m){a.push(252,m[0].length);for(j=0;j<m[0].length;j+=2)a.push((Number(m[0].charAt(j))<<4)|(j+1<m[0].length?Number(m[0].charAt(j+1)):15));i+=m[0].length;continue;}
 var c=s.charCodeAt(i++);if(c<128)a.push(c);else a.push(253,c>>8,c&255);
 }var ck=crc(a);a.push(ck>>8,ck&255);return b32(a);}
function unpack(raw){var s=raw.toUpperCase().replace(/[\s-]/g,'').replace(/O/g,'0').replace(/[IL]/g,'1');assert(s.length>8&&s.length<100000,'连接码长度不正确');var a=un32(s),end=a.length-2;assert(end>=2&&crc(a.slice(0,end))===((a[end]<<8)|a[end+1]),'校验失败：请核对字符或是否漏输');assert(a[0]===3&&(a[1]===1||a[1]===2),'连接码版本或类型不正确');var out='',i=2,j,v,hex,n;function byte(){assert(i<end,'连接码不完整');return a[i++];}function h(v){return ('0'+v.toString(16)).slice(-2);}while(i<end){v=byte();if(v<128)out+=String.fromCharCode(v);else if(v>=128&&v<128+dict.length)out+=dict[v-128];else if(v===250){n=byte();var hs=[];for(j=0;j<n;j++)hs.push(h(byte()).toUpperCase());out+=hs.join(':');}else if(v===251){hex='';for(j=0;j<16;j++)hex+=h(byte());out+=hex.slice(0,8)+'-'+hex.slice(8,12)+'-'+hex.slice(12,16)+'-'+hex.slice(16,20)+'-'+hex.slice(20);}else if(v===252){n=byte();for(j=0;j<n;j+=2){var b=byte();out+=String(b>>4);if(j+1<n)out+=String(b&15);}}else if(v===253){out+=String.fromCharCode((byte()<<8)|byte());}else throw new Error('连接码内容不正确');}return {type:a[1]===1?'offer':'answer',sdp:out};}
function formatCode(s){var groups=s.match(/.{1,5}/g)||[],lines=[];for(var i=0;i<groups.length;i+=4)lines.push(groups.slice(i,i+4).join(' '));return lines.join('\n');}
function readCode(raw){raw=raw.trim();if(raw.charAt(0)==='{')return JSON.parse(raw);return unpack(raw);}

function qrLog(t){$('qrStatus').textContent=t;}
function frameCheck(s){var a=[];for(var i=0;i<s.length;i++)a.push(s.charCodeAt(i));return ('0000'+crc(a).toString(16)).slice(-4).toUpperCase();}
function displayQR(code,kind){var chunks=code.match(/.{1,175}/g)||[];assert(chunks.length<=99,'连接描述过长');var id=frameCheck(code);qrFrames=chunks.map(function(chunk,i){var t='PL5|'+id+'|'+(i+1)+'|'+chunks.length+'|'+chunk;return t+'|'+frameCheck(t);});qrIndex=0;$('qrTitle').textContent=kind==='offer'?'房主 · 邀请二维码':'成员 · 应答二维码';$('displayNext').textContent=kind==='offer'?'扫描成员应答':'等待房主确认';drawFrame();}
function drawFrame(){if(!qrFrames.length)return;PadQR.encode(qrFrames[qrIndex],$('qrCanvas'));$('qrPage').textContent='第 '+(qrIndex+1)+' / '+qrFrames.length+' 张';$('qrPrev').disabled=qrIndex===0;$('qrNext').disabled=qrIndex===qrFrames.length-1;}
function parseFrame(t){assert(typeof t==='string'&&t.length<=210,'二维码数据无效');var p=t.split('|');assert(p.length===6&&p[0]==='PL5'&&/^[0-9A-F]{4}$/.test(p[1])&&/^\d{1,2}$/.test(p[2])&&/^\d{1,2}$/.test(p[3])&&/^[0-9A-HJKMNP-TV-Z]{1,175}$/.test(p[4])&&frameCheck(p.slice(0,5).join('|'))===p[5],'二维码校验失败');var idx=Number(p[2]),n=Number(p[3]);assert(idx>=1&&idx<=n&&n<=99,'分片序号无效');return {id:p[1],idx:idx,n:n,chunk:p[4]};}

function receiveFrame(t){var f=parseFrame(t);if(!qrParts||qrParts.id!==f.id||qrParts.n!==f.n)qrParts={id:f.id,n:f.n,items:{}};qrParts.items[f.idx]=f.chunk;var count=Object.keys(qrParts.items).length;if(count<f.n){qrLog('已扫描 '+count+' / '+f.n+' 张，请扫描下一张。');return false;}var code='';for(var i=1;i<=f.n;i++)code+=qrParts.items[i];assert(frameCheck(code)===f.id,'完整数据校验失败');var d=unpack(code);assert(d.type===scanKind,'二维码类型不符');$('remote').value=formatCode(code);qrLog('扫描成功');stopCam();if(d.type==='offer'){show('pair');answer(d,false);}else accept(d);return true;}
function stopCam(){++camRun;clearTimeout(qrTimer);if(qrStream){qrStream.getTracks().forEach(function(t){t.stop();});qrStream=null;}var v=$('qrVideo');v.srcObject=null;v.style.display='none';}
function readPicture(source,w,h){var canvas=$('scanCanvas'),scale=Math.min(1,1000/Math.max(w,h));canvas.width=Math.max(1,Math.round(w*scale));canvas.height=Math.max(1,Math.round(h*scale));var c=canvas.getContext('2d');c.drawImage(source,0,0,canvas.width,canvas.height);return PadQR.decode(c.getImageData(0,0,canvas.width,canvas.height));}
function scanTick(k){if(k!==camRun||!qrStream)return;try{var v=$('qrVideo');if(v.readyState>=2&&v.videoWidth){var t=readPicture(v,v.videoWidth,v.videoHeight);if(t&&receiveFrame(t))return;}}catch(e){qrLog('扫描失败：'+msg(e));}if(k===camRun)qrTimer=setTimeout(function(){scanTick(k);},450);}
function startCam(){stopCam();var k=camRun;var get=navigator.mediaDevices&&navigator.mediaDevices.getUserMedia;var old=navigator.getUserMedia||navigator.webkitGetUserMedia;qrLog('请求摄像头权限…');var p;try{if(get)p=navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:960},height:{ideal:720}},audio:false});else if(old)p=new Promise(function(res,rej){old.call(navigator,{video:true,audio:false},res,rej);});else throw new Error('摄像头 API 不可用（可能是非安全上下文或宿主限制）');p.then(function(stream){if(k!==camRun){stream.getTracks().forEach(function(t){t.stop();});return;}qrStream=stream;var v=$('qrVideo');v.style.display="block";v.srcObject=stream;var pp=v.play();if(pp&&pp.catch)pp.catch(function(){});qrLog('摄像头已开启，请正对对方二维码。');scanTick(k);}).catch(function(e){if(k===camRun)qrLog('摄像头不可用：'+msg(e)+'。请尝试导入照片或手动配对。');});}catch(e){qrLog(msg(e)+'。请尝试导入照片。');}}

function scan(kind){if(kind==='offer'&&role){status('请先退出房间');return;}if(kind==='answer'&&!(pending&&pending.p.signalingState==='have-local-offer')){status('请先创建邀请');return;}scanKind=kind;qrParts=null;$('scanTitle').textContent=kind==='offer'?'扫描房主邀请':'扫描成员应答';qrLog('等待扫描');show('scanner');}
function send(){var v=$('message').value.trim();if(!v||!canSend())return;if(role==='host'){groupMessage(me,name,v);}else if(!wire(up,{v:2,t:'submit',body:v})){status('发送失败，请检查连接');return;}$('message').value='';}
bind('navChat',function(){show('chat');});bind('navPair',function(){show('pair');});bind('navMembers',function(){show('members');});bind('navSettings',function(){show('settings');});bind('createRoom',createRoom);bind('offer',function(){offer(false);});bind('scanOffer',function(){scan('offer');});bind('scanAnswer',function(){scan('answer');});bind('showLocal',function(){if(qrFrames.length)show('display');});bind('cancelInvite',function(){if(pending)drop(pending,'已取消当前邀请');else if(role==='guest'&&!ready(up))reset();show('pair');});bind('disconnect',function(){if(role&&confirm('退出当前房间？房主退出会结束整个房间。')){reset();show('pair');}});bind('backPair',function(){show('pair');});bind('displayNext',function(){if(localKind==='offer')scan('answer');else show('chat');});bind('qrPrev',function(){if(qrIndex>0){qrIndex--;drawFrame();}});bind('qrNext',function(){if(qrIndex<qrFrames.length-1){qrIndex++;drawFrame();}});bind('camStart',startCam);bind('camStop',function(){stopCam();qrLog('摄像头已停止');});bind('scanBack',function(){show('pair');});bind('scanReset',function(){qrParts=null;qrLog('分片已清除');});bind('manual',function(){show('manualPage');});bind('manualBack',function(){show('pair');});bind('manualOffer',function(){offer(true);});bind('manualAnswer',function(){try{answer(readCode($('remote').value),true);}catch(e){fail(e);}});bind('manualAccept',function(){try{accept(readCode($('remote').value));}catch(e){fail(e);}});bind('send',send);$('message').onkeydown=function(e){if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing&&e.keyCode!==229){e.preventDefault();send();}};bind('saveName',function(){name=$('nickname').value.trim().slice(0,24)||'游客';$('nickname').value=name;try{localStorage.setItem('blackmi_connect_name',name);}catch(e){}if(role==='host')syncRoster();else if(ready(up))wire(up,{v:2,t:'hello',name:name});show('chat');});bind('clearChat',function(){if(confirm('清空本机聊天记录？')){history=[];renderChat();show('chat');}});bind('showLog',function(){$('log').textContent=logs.join('\n');show('diagnostic');});bind('logBack',function(){show('settings');});bind('refreshMembers',renderMembers);
$('qrImage').onchange=function(){var f=this.files&&this.files[0];this.value='';if(!f)return;if(f.size>20000000){qrLog('图片过大');return;}var u=URL.createObjectURL(f),img=new Image();img.onload=function(){try{if(screen!=='scanner')return;var t=readPicture(img,img.naturalWidth,img.naturalHeight);if(t)receiveFrame(t);else qrLog('未识别，请正对二维码拍摄并保留白边');}catch(e){qrLog('识别失败：'+msg(e));}finally{URL.revokeObjectURL(u);}};img.onerror=function(){URL.revokeObjectURL(u);qrLog('无法读取图片');};img.src=u;};$('importCode').onchange=function(){var f=this.files&&this.files[0];if(!f||f.size>100000)return;var r=new FileReader();r.onload=function(){$('remote').value=String(r.result);};r.readAsText(f);};bind('saveCode',function(){if(!$('local').value)return;var a=document.createElement('a'),u=URL.createObjectURL(new Blob([$('local').value],{type:'text/plain'}));a.href=u;a.download='blackmi_connection.txt';document.body.appendChild(a);a.click();document.body.removeChild(a);setTimeout(function(){URL.revokeObjectURL(u);},3000);});window.addEventListener('pagehide',function(){reset();});status('未加入房间');show('pair');})();</script></body></html>
