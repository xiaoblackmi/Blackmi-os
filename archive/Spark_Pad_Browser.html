<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spark Pad Browser</title>
<style>
*{box-sizing:border-box}html,body{margin:0;padding:0;width:100%;background:#f2f5f7;color:#182c35;font:14px Arial,'Microsoft YaHei',sans-serif}body{overflow:hidden}button,input,a{font:inherit}button{cursor:pointer;color:#243b45;background:#fff;border:1px solid #c9d5d9;border-radius:6px;padding:0 9px;height:34px;white-space:nowrap}button:disabled{opacity:.4}button:focus,input:focus{outline:2px solid #0c8078;outline-offset:-2px}button.primary{background:#086d65;color:white;border-color:#086d65}#header{background:#e9eff1;border-bottom:1px solid #bdcdd2;padding:4px 6px 3px}#top{display:flex;align-items:center;height:34px}#brand{color:#086d65;font-weight:bold;margin-right:8px;white-space:nowrap}#tabs{display:flex;flex:1;min-width:0;overflow-x:auto;overflow-y:hidden;height:34px;align-items:center} .tab{display:flex;align-items:center;flex:none;max-width:155px;height:31px;background:#dce5e8;border-radius:7px 7px 3px 3px;margin-right:4px;border:1px solid #c7d3d8}.tab.active{background:white;border-color:#a5c5c1}.tab button{border:0;background:transparent;height:28px;padding:0 7px}.tab .label{max-width:116px;overflow:hidden;text-overflow:ellipsis}.tab .close{font-size:18px;padding:0 7px}#add{font-size:21px;margin-left:4px;height:30px}#nav{display:flex;align-items:center;margin-top:4px;height:36px}#nav button{flex:none;margin-right:4px;height:34px}#nav .icon{width:34px;padding:0;font-size:17px}#address{height:34px;flex:1;min-width:50px;border:1px solid #9eb5bd;border-radius:6px;padding:0 9px;background:white;color:#162c36;margin-right:4px}#nav #go{padding:0 12px}#nav #direct{margin-right:0}#status{height:24px;padding:4px 8px;background:#f5f8f9;border-bottom:1px solid #d4e0e3;color:#4b616a;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#stage{display:block;width:100%;overflow:hidden;background:white}#stage iframe{display:block;width:100%;border:0;margin:0;padding:0;background:white}#local{display:block;overflow:auto;width:100%;background:#fff;padding:12px 16px}#local h1{font-size:21px;margin:2px 0 7px;color:#086d65}#local h2{font-size:17px;margin:0 0 8px}#local p{margin:7px 0;line-height:1.5;color:#4b616a}#local .actions button{margin:4px 6px 4px 0;height:38px}#local .item{display:flex;align-items:center;border-bottom:1px solid #e1e9ea;padding:5px 0;min-height:42px}#local .item .name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left;border:0;color:#086d65}#local .item .remove{margin-left:6px}#local .detail{font-size:12px;word-break:break-all}#local .back{margin-bottom:10px}#local .empty{color:#62747b}.note{font-size:12px}#direct{font-size:12px} @media(max-width:560px){#brand{display:none}#nav .icon{width:28px}#nav button{margin-right:2px}#nav #go{padding:0 7px}#direct{padding:0 5px}#address{padding:0 5px}#local{padding:10px}}
</style></head><body>
<div id="header"><div id="top"><span id="brand">SPARK PAD</span><div id="tabs"></div><button id="add" type="button" aria-label="新建标签页">＋</button></div><div id="nav"><button id="back" class="icon" type="button" title="上一个地址">‹</button><button id="forward" class="icon" type="button" title="下一个地址">›</button><button id="refresh" class="icon" type="button" title="刷新">⟳</button><button id="home" class="icon" type="button" title="主页">⌂</button><input id="address" type="url" placeholder="输入获准访问的网站地址" autocomplete="off" autocapitalize="off" spellcheck="false"><button id="go" class="primary" type="button">打开</button><button id="star" class="icon" type="button" title="收藏">☆</button><button id="direct" type="button" title="通过正常网页导航打开">直达</button></div></div>
<div id="status" role="status">准备就绪</div><div id="stage"><div id="local"><h1>Spark Pad Browser</h1><p>若此提示一直存在，可能是当前环境未执行 JavaScript。</p></div></div>
<script>
(function(){'use strict';
var tabs=[],active=null,seq=0,storageOK=true,bookmarks=[],history=[],local=document.getElementById('local'),stage=document.getElementById('stage'),homeURL='spark:home',site='https://www.iflytek.com/';
function el(id){return document.getElementById(id);}function node(tag,txt,cls){var e=document.createElement(tag);if(txt!==undefined)e.textContent=txt;if(cls)e.className=cls;return e;}function btn(txt,fn,cls){var b=node('button',txt,cls);b.type='button';b.onclick=fn;return b;}function clear(e){while(e.firstChild)e.removeChild(e.firstChild);}function status(s){el('status').textContent=s;}function read(key,fallback){try{var v=localStorage.getItem('sparkpad.v1.'+key);return v?JSON.parse(v):fallback;}catch(e){storageOK=false;return fallback;}}function save(){try{localStorage.setItem('sparkpad.v1.bookmarks',JSON.stringify(bookmarks));localStorage.setItem('sparkpad.v1.history',JSON.stringify(history));}catch(e){storageOK=false;}}
function parse(s){s=String(s||'').replace(/^\s+|\s+$/g,'');if(!s)return null;if(!/^[a-z][a-z0-9+.-]*:/i.test(s))s='https://'+s;try{var u=new URL(s);if((u.protocol!=='https:'&&u.protocol!=='http:')||!u.hostname||u.username||u.password)return null;return u.href;}catch(e){return null;}}
function label(url){if(url===homeURL)return '新标签页';if(url===site)return '科大讯飞';try{return new URL(url).hostname;}catch(e){return url;}}function current(t){return t.urls[t.index];}function renderTabs(){var bar=el('tabs');clear(bar);tabs.forEach(function(t){var wrap=node('div',undefined,'tab'+(t===active?' active':''));var b=btn(label(current(t)),function(){switchTo(t);},'label');b.title=current(t);wrap.appendChild(b);var c=btn('×',function(){closeTab(t);},'close');c.setAttribute('aria-label','关闭标签页');wrap.appendChild(c);bar.appendChild(wrap);});}
function resize(){var h=Math.max(90,(window.innerHeight||document.documentElement.clientHeight)-el('header').offsetHeight-el('status').offsetHeight);stage.style.height=h+'px';local.style.height=h+'px';tabs.forEach(function(t){if(t.frame){t.frame.style.height=h+'px';t.frame.height=h;}});}function update(){var u=current(active);el('address').value=u===homeURL?'':u;el('back').disabled=active.index<=0;el('forward').disabled=active.index>=active.urls.length-1;el('star').disabled=u===homeURL;el('direct').disabled=u===homeURL;el('star').textContent=bookmarks.some(function(b){return b.url===u;})?'★':'☆';renderTabs();resize();}
function hideFrames(){tabs.forEach(function(t){if(t.frame)t.frame.style.display='none';});}function drop(t){if(t.frame){t.frame.onload=null;t.frame.onerror=null;if(t.frame.parentNode)t.frame.parentNode.removeChild(t.frame);t.frame=null;}if(t.timer){clearTimeout(t.timer);t.timer=null;}}
function remember(u){history.unshift({url:u,time:Date.now()});if(history.length>100)history.length=100;save();}
function show(){hideFrames();var t=active,u=current(t);update();if(u===homeURL){renderHome();return;}local.style.display='none';if(!t.frame){var f=document.createElement('iframe');t.frame=f;f.title='网页浏览区';f.style.cssText='display:block;width:100%;border:0;margin:0;padding:0;background:#fff';f.setAttribute('referrerpolicy','no-referrer');t.message='正在请求网页…';f.onload=function(){if(t.frame!==f)return;clearTimeout(t.timer);t.message='收到加载事件；请以网页实际显示为准';if(active===t)status(t.message);};f.onerror=function(){if(t.frame!==f)return;clearTimeout(t.timer);t.message='网页加载错误；可能受网站或设备策略限制';if(active===t)status(t.message);};f.src=u;stage.appendChild(f);t.timer=setTimeout(function(){if(t.frame===f){t.message='等待响应；空白或报错可能由网络、网站或设备策略造成';if(active===t)status(t.message);}},15000);}t.frame.style.display='block';status(t.message||'网页浏览区');resize();}
function switchTo(t){active=t;show();}function addTab(){var t={id:++seq,urls:[homeURL],index:0,frame:null,message:''};tabs.push(t);switchTo(t);}function closeTab(t){var i=tabs.indexOf(t);if(i<0)return;drop(t);tabs.splice(i,1);if(!tabs.length){addTab();return;}if(active===t)switchTo(tabs[Math.max(0,i-1)]);else renderTabs();}
function go(u){if(u!==homeURL){u=parse(u);if(!u){status('请输入有效的 HTTP 或 HTTPS 网站地址');return;}}if(current(active)!==u){drop(active);active.urls=active.urls.slice(0,active.index+1);active.urls.push(u);active.index++;if(u!==homeURL)remember(u);}show();}function move(d){var n=active.index+d;if(n>=0&&n<active.urls.length){drop(active);active.index=n;show();}}function openInput(){go(el('address').value);}function direct(){var u=current(active);if(u!==homeURL){var a=node('a');a.href=u;a.target='_self';a.rel='noreferrer';document.body.appendChild(a);a.click();a.parentNode.removeChild(a);}}
function localPage(){hideFrames();local.style.display='block';clear(local);resize();}function renderHome(){localPage();local.appendChild(node('h1','Spark Pad Browser'));local.appendChild(node('p','轻量网页浏览器 · Android WebView 80 兼容设计'));var actions=node('div',undefined,'actions');actions.appendChild(btn('科大讯飞官网',function(){go(site);},'primary'));actions.appendChild(btn('收藏夹',function(){renderList('bookmarks');}));actions.appendChild(btn('历史记录',function(){renderList('history');}));actions.appendChild(btn('使用说明',help));local.appendChild(actions);local.appendChild(node('p','输入已获准访问的网站地址即可尝试加载。网站禁止嵌入时，可使用正常网页导航“直达”（仍受设备及网站策略约束）。','note'));status(storageOK?'主页 · 本地存储可用':'主页 · 本地存储不可用，仅本次会话保留');}
function renderList(type){localPage();local.appendChild(btn('返回主页',renderHome,'back'));local.appendChild(node('h2',type==='history'?'历史记录':'收藏夹'));var list=type==='history'?history:bookmarks;if(!list.length)local.appendChild(node('p','暂无记录','empty'));if(type==='history'&&list.length)local.appendChild(btn('清空历史',function(){history=[];save();renderList(type);}));list.forEach(function(item,i){var row=node('div',undefined,'item');var b=btn(label(item.url)+'  ·  '+item.url,function(){go(item.url);},'name');b.title=item.url;row.appendChild(b);row.appendChild(btn('删除',function(){list.splice(i,1);save();renderList(type);},'remove'));local.appendChild(row);});status('本地记录 · 仅保存通过地址栏打开的网址');}
function help(){localPage();local.appendChild(btn('返回主页',renderHome,'back'));local.appendChild(node('h2','使用说明'));['地址栏：输入获准访问的 HTTP / HTTPS 地址。','‹ / ›：返回或前进到本工具记录的地址，不能读取跨域网页内的点击历史。','⟳：重新创建当前网址的网页框；☆：收藏当前网址；直达：普通同窗口导航。','网页内容由目标站点提供，本工具不会修改响应头、设备白名单、代理或网络设置。','若 iframe 内网页报错，请遵守网站及学校管理策略；有访问需求可申请管理员授权。','跨域网页的实际地址、证书和 HTTP 状态无法由本文件读取；加载事件不代表成功。'].forEach(function(s){local.appendChild(node('p',s));});local.appendChild(node('p',navigator.userAgent,'detail'));status('说明 · 内核由宿主应用提供');}
bookmarks=read('bookmarks',[]);history=read('history',[]);if(!Array.isArray(bookmarks))bookmarks=[];if(!Array.isArray(history))history=[];bookmarks=bookmarks.filter(function(b){return b&&parse(b.url);});history=history.filter(function(b){return b&&parse(b.url);});
el('add').onclick=addTab;el('go').onclick=openInput;el('address').onkeydown=function(e){if(e.key==='Enter'||e.keyCode===13){e.preventDefault();openInput();}};el('back').onclick=function(){move(-1);};el('forward').onclick=function(){move(1);};el('refresh').onclick=function(){drop(active);show();};el('home').onclick=function(){go(homeURL);};el('direct').onclick=direct;el('star').onclick=function(){var u=current(active);if(u===homeURL)return;var i=bookmarks.map(function(b){return b.url;}).indexOf(u);if(i>=0)bookmarks.splice(i,1);else bookmarks.push({url:u,time:Date.now()});save();update();status(i>=0?'已移除收藏':'已收藏当前地址');};window.addEventListener('resize',resize);window.addEventListener('orientationchange',function(){setTimeout(resize,100);});addTab();})();
</script></body></html>
